ShortDescription: 'Free Windows 10 and 11 app: see Apple Magic Mouse, Magic Keyboard and Magic Trackpad battery percent beside the clock, and fix a mouse that won''t scroll.'
Description: >-
  Magic Tray puts the battery percentage of an Apple Magic Mouse, Magic
  Keyboard or Magic Trackpad in the Windows notification area, next to the
  clock. It is a free, open source, MIT licensed alternative to paid Magic
  Utilities style tools, with no subscription and no account.

  Magic Tray is portable. It does not need administrator rights to run and
  show battery levels. Battery percent needs no driver of any kind. It reads
  battery over Bluetooth HID and polls adaptively so it stays cheap when
  nothing changes.

  Two optional repairs sit in the tray menu, and neither one ever starts on
  its own. For a Magic Mouse that will not scroll, "Fix scrolling" offers
  whatever route exists for that exact model: for the older models it opens a
  download page and installs nothing itself, and for the 2024 USB-C model it
  can run a driver step for you once you confirm. "Fix battery reads" runs the
  one-time keyboard battery unlock for a Magic Keyboard whose battery does not
  report. Both ask for elevation at the moment they run, and the mouse side can
  be put back to the stock Windows driver from the same menu.
