# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: LesleyMurfin.MagicTray
PackageVersion: 1.1.0

# Magic Tray is not an installer. MagicMouseTray.exe is a self-contained,
# single-file .NET publish (PublishSingleFile + SelfContained + RuntimeIdentifier
# win-x64 in MagicMouseTray.csproj), so the exe the release attaches is the whole
# app and is the asset every link on https://magictray.app/ already points at.
# That is exactly what InstallerType: portable is for.
InstallerType: portable

# For a non-archive portable, WinGet takes the symlink name from Commands[0] and
# falls back to the file name. Verified in winget-cli PortableFlow.cpp: the
# non-nested branch reads Installer->Commands and uses commands[0] as
# commandAlias, appending .exe. So this one entry is the command alias, and
# `magictray` is what a person types rather than the historical exe name.
# PortableCommandAlias is deliberately absent: the 1.12 schema only defines it
# inside NestedInstallerFiles, and PortableFlow.cpp only reads it on the nested
# path, so on a bare portable it would be an unknown field that does nothing.
Commands:
- magictray
Platform:
- Windows.Desktop
# Windows 10 1809. Matches the csproj target framework, net8.0-windows10.0.17763.0.
MinimumOSVersion: 10.0.17763.0
UpgradeBehavior: install
# Date the v1.1.0 release was published. Quoted so it stays a YAML string, which
# is what the schema requires ("type": ["string", "null"], "format": "date").
ReleaseDate: '2026-09-02'
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/LesleyMurfin/magic-tray/releases/download/v1.1.0/MagicMouseTray.exe
  # Downloaded from the URL above on 2026-09-16, 186,528,764 bytes, and hashed.
  # Matches the digest the GitHub release API reports for the asset.
  InstallerSha256: 696DB5FF96360A125C83AF7C3C5D752626B9DE728EA42240D0ECAB81B9F4DCD7
ManifestType: installer
ManifestVersion: 1.12.0
