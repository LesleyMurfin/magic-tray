name = "magic-drivers-webhook"
type = "service"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Global data
[env.production]
name = "magic-drivers-webhook"

# Environment variables (use `wrangler secret put` for sensitive values)
[env.production.vars]
SITE_URL = "https://magictray.app/drivers"
STRIPE_API_VERSION = "2025-02-28"

# KV namespace for download tracking and stats (create with: wrangler kv namespace create magic-drivers-stats)
[[kv_namespaces]]
binding = "STATS_KV"
id = "magic-drivers-stats"
preview_id = "magic-drivers-stats-preview"

# KV namespace for donation ledger and funding state (create with: wrangler kv namespace create magic-drivers-donations)
[[kv_namespaces]]
binding = "DONATIONS_KV"
id = "magic-drivers-donations"
preview_id = "magic-drivers-donations-preview"

# KV namespace for email subscribers (create with: wrangler kv namespace create magic-drivers-subscribers)
[[kv_namespaces]]
binding = "SUBSCRIBERS_KV"
id = "magic-drivers-subscribers"
preview_id = "magic-drivers-subscribers-preview"

# Routes: API endpoints for downloads, stats, donations, and webhooks
[[routes]]
pattern = "magictray.app/api/downloads"
zone_name = "magictray.app"

[[routes]]
pattern = "magictray.app/api/stats/*"
zone_name = "magictray.app"

[[routes]]
pattern = "magictray.app/api/webhook/stripe"
zone_name = "magictray.app"

[[routes]]
pattern = "magictray.app/api/checkout"
[[routes]]
pattern = "magictray.app/api/email-subscribe"
zone_name = "magictray.app"

[[routes]]
pattern = "magictray.app/api/email-unsubscribe"
zone_name = "magictray.app"

[build]
command = "npm install"
cwd = "."

[build.upload]
format = "modules"
main = "./src/index.js"

# Env-specific overrides for staging
[env.staging]
name = "magic-drivers-webhook-staging"

[[env.staging.routes]]
pattern = "staging.magictray.app/api/*"
zone_name = "magictray.app"
