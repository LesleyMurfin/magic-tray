name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        persist-credentials: false

    # No NuGet caching: setup-dotnet's `cache: true` demands a packages.lock.json
    # (this repo has none, and does not set RestorePackagesWithLockFile), and
    # actions/cache is outside the approved action set. Restore stays uncached.
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore MagicMouseTray.Tests/MagicMouseTray.Tests.csproj

    - name: Build
      run: dotnet build MagicMouseTray.Tests/MagicMouseTray.Tests.csproj --no-restore -c Release

    - name: Test
      run: dotnet test MagicMouseTray.Tests/MagicMouseTray.Tests.csproj --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: test-results
        path: TestResults/*.trx
        retention-days: 14

  verify-publish:
    name: Verify publish
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        persist-credentials: false

    # Guards the MSB3030 class of break: a Content Include left pointing at a
    # file that no longer exists fails the build for every PR, not just its own.
    - name: Check csproj Content paths exist on disk
      shell: pwsh
      run: |
        $proj = 'MagicMouseTray/MagicMouseTray.csproj'
        $root = Split-Path -Parent $proj
        $missing = @(
          Select-Xml -Path $proj -XPath '//Content/@Include' |
            ForEach-Object { $_.Node.Value } |
            Where-Object { -not (Test-Path -LiteralPath (Join-Path $root ($_ -replace '\\', '/'))) }
        )
        if ($missing) { throw "csproj Content Include paths missing on disk: $($missing -join ', ')" }
        Write-Host "All csproj Content Include paths exist."

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
      with:
        dotnet-version: '8.0.x'

    - name: Publish
      run: dotnet publish MagicMouseTray/MagicMouseTray.csproj -c Release -o publish

    - name: Stage keyboard patch and diagnostic scripts
      run: pwsh -File scripts/stage-publish.ps1 -PublishDir publish

    # verify-release.ps1 treats a missing ZIP as a hard failure, never a skip,
    # so CI has to build one. That is deliberate: the portable ZIP is the
    # primary release asset, and its layout is load-bearing — the tray resolves
    # the keyboard unlock and the Diagnostics scripts at <exe>/scripts/. Packaging
    # here means a PR that breaks that layout fails now, not at tag time.
    - name: Package portable ZIP
      run: pwsh -File scripts/package-release.ps1 -PublishDir publish -Tag "ci-${{ github.sha }}" -OutDir dist

    - name: Verify release artifacts
      run: pwsh -File scripts/verify-release.ps1 -PublishDir publish

    # Hand the packaged ZIP (and its checksum) to reviewers so a PR build can be
    # downloaded and run without rebuilding it locally.
    - name: Upload portable ZIP
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: portable-zip
        path: |
          dist/*.zip
          dist/*.zip.sha256
        retention-days: 14
