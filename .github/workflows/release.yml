name: release

# Build, test, publish, optionally Authenticode-sign, then package the portable
# MagicTray-<tag>-win-x64.zip (exe + scripts/ + README.txt + SHA256SUMS) and
# attach it first on a v* tag. The loose exe and scripts stay attached too,
# because links already in the wild point at them. A SHA256SUMS covering every
# uploaded asset goes up with them, and the notes quote the exe's digest and
# byte length so nobody needs a second download to check the first.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      # gh release create authenticates through GH_TOKEN below, not through the
      # git credential helper, so the checkout needs no persisted token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MagicMouseTray/MagicMouseTray.csproj

      - name: Build
        run: dotnet build MagicMouseTray/MagicMouseTray.csproj -c Release --no-restore

      # Unit tests target net8.0-windows and require the windows-latest runner.
      - name: Test
        run: dotnet test MagicMouseTray.Tests/MagicMouseTray.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14

      - name: Publish (single-file, self-contained win-x64)
        run: dotnet publish MagicMouseTray/MagicMouseTray.csproj -c Release -o publish

      - name: Stage keyboard patch and diagnostic scripts
        run: pwsh -File scripts/stage-publish.ps1 -PublishDir publish

      # Optional Authenticode signing — runs only when the PFX secrets exist.
      - name: Sign (optional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          ./scripts/sign-app.ps1 -Exe publish/MagicMouseTray.exe -PfxPath "$env:RUNNER_TEMP\cert.pfx" -PfxPassword $env:SIGN_PFX_PASSWORD

      # Packaging runs AFTER the signing step so the exe inside the ZIP is the
      # signed one. All layout logic lives in scripts/package-release.ps1.
      - name: Package portable ZIP
        id: package
        shell: pwsh
        run: ./scripts/package-release.ps1 -PublishDir publish -Tag "$env:GITHUB_REF_NAME" -OutDir dist

      # GITHUB_REF_NAME is a default Actions env var: read it instead of
      # interpolating github.ref_name into the command line.
      - name: Verify release artifacts
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: pwsh -File scripts/verify-release.ps1 -PublishDir publish -Tag "$env:GITHUB_REF_NAME" -ZipPath "$env:ZIP_PATH"

      - name: Write release notes
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
          ZIP_BYTES: ${{ steps.package.outputs.zip_bytes }}
          EXE_SHA256: ${{ steps.package.outputs.exe_sha256 }}
          EXE_BYTES: ${{ steps.package.outputs.exe_bytes }}
        run: |
          # N0 against the invariant culture: the byte counts read the same
          # whatever locale the runner image happens to carry.
          $inv = [Globalization.CultureInfo]::InvariantCulture
          $exeSize = ([long]$env:EXE_BYTES).ToString('N0', $inv)
          $zipSize = ([long]$env:ZIP_BYTES).ToString('N0', $inv)
          # Backticks are PowerShell's escape character, so every line carrying
          # markdown code spans is a single-quoted template filled with -f.
          $lines = @(
            "**Recommended download: $env:ZIP_NAME** — unzip the whole folder, then run MagicMouseTray.exe.",
            '',
            'Take the zip rather than the bare exe: it includes the scripts folder that the keyboard battery unlock ("Fix battery reads") and the Diagnostics menu read from, and the exe on its own cannot find them.',
            '',
            '### Check what you downloaded',
            '',
            'You do not have to do this. Open PowerShell in the folder you downloaded to, run `Get-FileHash` on the file, and compare it with the line below. `Get-FileHash` uses SHA-256 by default and prints it in capitals, so it matches ignoring case.',
            '',
            '| Asset | Bytes | SHA-256 |',
            '| --- | --- | --- |',
            ('| `MagicMouseTray.exe` | {0} | `{1}` |' -f $exeSize, $env:EXE_SHA256),
            ('| `{0}` | {1} | `{2}` |' -f $env:ZIP_NAME, $zipSize, $env:ZIP_SHA256),
            '',
            ('`SHA256SUMS` below lists every other file attached here (it cannot list itself) in the usual `<hash>  <filename>` form, so `sha256sum -c SHA256SUMS` checks the lot at once.')
          )
          [IO.File]::WriteAllLines("$env:RUNNER_TEMP/release-notes.md", [string[]]$lines)

      # The ZIP is listed first so it is the primary asset. The loose exe and
      # scripts stay attached because existing links point at them.
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          SUMS_PATH: ${{ steps.package.outputs.sums }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ZIP_PATH" "${env:ZIP_PATH}.sha256" "publish/MagicMouseTray.exe" "publish/kbd-patch-cachedservices.ps1" "publish/Install-KeyboardBattery.cmd" "publish/capture-state.ps1" "publish/diagnose-driver.ps1" "publish/mm-bt-stack-snapshot.ps1" "$env:SUMS_PATH" --notes-file "$env:RUNNER_TEMP/release-notes.md" --generate-notes
